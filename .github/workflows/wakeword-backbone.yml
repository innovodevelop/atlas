# Converts Google's Apache-2.0 speech_embedding module to ONNX and compares it
# with the openWakeWord backbone it would replace (ROADMAP.md blocker 1,
# feat-023). See scripts/wakeword-backbone/convert.py.
#
# Not part of the normal build: it runs only when its own files change on a
# ws-* branch, or by hand. The ONNX file, the report and the log are uploaded as
# an artifact AND pushed to the `wakeword-backbone-output` branch (never to the
# branch that triggered it): artifacts and job logs live on blob storage that
# some dev environments can't reach, while git always works. Errors are also
# raised as job annotations, readable through the GitHub API.
name: Wake-word backbone

on:
  workflow_dispatch:
  push:
    branches: ["ws-*"]
    paths:
      - "scripts/wakeword-backbone/**"
      - ".github/workflows/wakeword-backbone.yml"

permissions:
  contents: write  # only to push the wakeword-backbone-output branch

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter
        run: pip install -r scripts/wakeword-backbone/requirements.txt
      - name: Fetch a Piper voice for the test clips (MIT tool, CC BY 4.0 voice)
        # Only for the comparison clips; nothing from Piper ends up in the model.
        continue-on-error: true
        run: |
          pip install piper-tts==1.2.0
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium
          curl -sSfL -o voices/en_US-lessac-medium.onnx "$base/en_US-lessac-medium.onnx"
          curl -sSfL -o voices/en_US-lessac-medium.onnx.json "$base/en_US-lessac-medium.onnx.json"
      - name: Convert and compare
        env:
          OUT_DIR: out
          MODELS_DIR: public/models
          PIPER_VOICE: voices/en_US-lessac-medium.onnx
        run: |
          mkdir -p out
          set -o pipefail
          python scripts/wakeword-backbone/convert.py 2>&1 | tee out/log.txt
      - name: Raise the error as an annotation
        if: failure()
        run: |
          tail -c 3500 out/log.txt | python3 -c 'import sys; t=sys.stdin.read(); print("::error title=convert.py failed::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))'
      - name: Push results to the output branch
        if: always()
        run: |
          cd out
          git init -q -b wakeword-backbone-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Output of .github/workflows/wakeword-backbone.yml for %s (run %s). Not source; regenerated on every run.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -q -m "wakeword-backbone output for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:wakeword-backbone-output
      - name: Report
        if: always()
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-embedding-onnx
          path: out/
