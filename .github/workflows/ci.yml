name: CI

on:
  push:
    branches: [atlas-redesign, "ws-*"]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc, lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        # -b is required: the root tsconfig uses project references with
        # "files": [], so a plain `tsc --noEmit` checks nothing.
        run: bunx tsc -b --force
      - name: Lint
        run: bunx eslint .
      - name: Build
        run: bun run build
      # Both editions, because they are different Rollup graphs: `bun run build`
      # is the consumer one, and a bundling failure confined to Lighthouse —
      # an admin-only lazy import that does not resolve, say — would otherwise
      # only show up when someone tried to ship it. Type errors are already
      # covered (tsc -b spans all of src regardless of edition); this covers the
      # graph. Writes to dist-admin/, so it cannot clobber the consumer output.
      - name: Build (admin edition)
        run: bun run build:admin
      # `tests/` is the auth suite (static checks; live tests are opt-in via
      # RUN_LIVE_AUTH_TESTS=1 and skip here). `./src` is every co-located
      # frontend test — 7 files, 119 tests, NONE of which ran in CI before
      # 2026-08-04: the filter was `tests/` alone, which matched one file.
      #
      # `./src` and not `src/`: bun treats a bare `src/` as a path SUBSTRING,
      # so it also matches services/atlas-brain/src and services/voice-gateway/
      # src — which have their own jobs below. A brain regression failing the
      # frontend job would point at the wrong place.
      - name: Tests (auth suite + frontend units)
        run: bun test tests/ ./src

  atlas-brain:
    name: Brain sidecar (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/atlas-brain
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests (adapter translation, memory integrity, rerank)
        run: bun test

  voice-gateway:
    name: Voice gateway (typecheck, VAD smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run fetch-models
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: VAD smoke (Silero preferred; energy fallback tolerated on CI runners)
        run: |
          bun run bench/vad-smoke.ts | tee vad.out
          grep -E "engine: silero" vad.out || echo "::warning::VAD ran on the energy fallback — Silero did not load on this CI runner (tolerated here; Silero is verified natively on macOS)"

  edge-functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all functions
        run: |
          cd supabase/functions
          fail=0
          for d in */; do
            d="${d%/}"
            [ "$d" = "_shared" ] && continue
            if ! deno check --quiet --no-lock "$d/index.ts"; then
              echo "❌ $d failed type-check"
              fail=1
            fi
          done
          exit $fail
