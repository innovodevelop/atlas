name: CI

on:
  push:
    branches: [atlas-redesign, "ws-*"]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc, lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        # -b is required: the root tsconfig uses project references with
        # "files": [], so a plain `tsc --noEmit` checks nothing.
        run: bunx tsc -b --force
      - name: Lint
        run: bunx eslint .
      - name: Build
        run: bun run build
      # Both editions, because they are different Rollup graphs: `bun run build`
      # is the consumer one, and a bundling failure confined to Lighthouse —
      # an admin-only lazy import that does not resolve, say — would otherwise
      # only show up when someone tried to ship it. Type errors are already
      # covered (tsc -b spans all of src regardless of edition); this covers the
      # graph. Writes to dist-admin/, so it cannot clobber the consumer output.
      - name: Build (admin edition)
        run: bun run build:admin
      # `tests/` is the auth suite (static checks; live tests are opt-in via
      # RUN_LIVE_AUTH_TESTS=1 and skip here). `./src` is every co-located
      # frontend test — 7 files, 119 tests, NONE of which ran in CI before
      # 2026-08-04: the filter was `tests/` alone, which matched one file.
      #
      # `./src` and not `src/`: bun treats a bare `src/` as a path SUBSTRING,
      # so it also matches services/atlas-brain/src and services/voice-gateway/
      # src — which have their own jobs below. A brain regression failing the
      # frontend job would point at the wrong place.
      - name: Tests (auth suite + frontend units)
        run: bun test tests/ ./src

  atlas-brain:
    name: Brain sidecar (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/atlas-brain
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      # supabase/functions/_shared/ is this sidecar's real import surface — see
      # the module doc-comment at src/index.ts and CLAUDE.md's "Inert
      # leftovers" note (the `supabase/functions/` directory name is legacy;
      # it holds runtime-neutral shared TS, not a live Supabase dependency).
      # The step above already typechecks whichever _shared files today's
      # src/*.ts happens to import, transitively — but that coverage is an
      # accident of the current import graph, not a guarantee: refactor an
      # import away and a file silently drops out of CI with no signal. This
      # step makes the coverage explicit by generating a barrel that imports
      # every _shared/*.ts file (minus the excluded dead ones below) and
      # feeding it through the same tsconfig, then deletes the barrel.
      #
      # It replaces the old `edge-functions` job, which looped `for d in */`
      # over supabase/functions/, skipped `_shared`, found nothing else in
      # that directory (it was deleted along with the other edge functions —
      # see CLAUDE.md's local-first migration note), and so passed every run
      # having checked zero files. See docs/decisions/013-edge-functions-ci-gate.md
      # for the verdict, the before/after proof, and why deno was dropped in
      # favor of running this from the brain's own tsconfig.
      #
      # Excluded, by name, not by silent omission: auth.ts, cors.ts, crypto.ts,
      # mailShared.ts. `rg` over the whole repo finds zero importers of any of
      # the four — they are dead Supabase-edge-function code with no runtime
      # path (same class as the CLAUDE.md "Inert leftovers"), and auth.ts also
      # imports a Deno-only `https://esm.sh/...` URL specifier that cannot
      # resolve under bunx tsc regardless of reachability. If a future _shared
      # file needs the same treatment, add it here WITH a reason — an
      # unreasoned addition to this list is exactly the defect this step
      # exists to prevent.
      #
      # Keep this step byte-identical to job_atlas_brain() in
      # scripts/ci/run.sh — the parity rule stated at the top of that script.
      - name: Typecheck supabase/functions/_shared (this sidecar's real import surface)
        run: |
          shared="../../supabase/functions/_shared"
          barrel="scripts/.ci-shared-typecheck.generated.ts"
          exclude="auth.ts cors.ts crypto.ts mailShared.ts"
          {
            echo "// AUTO-GENERATED by .github/workflows/ci.yml (job: atlas-brain). Not committed; deleted at the end of this step."
            for f in "$shared"/*.ts; do
              base="$(basename "$f")"
              case " $exclude " in
                *" $base "*) continue ;;
              esac
              echo "import \"../../../supabase/functions/_shared/$base\";"
            done
          } > "$barrel"
          # trap, not a trailing rm: the step runs under `bash -e`, so a tsc
          # failure (which is the whole point of this gate) would exit before
          # cleanup and leave the generated barrel behind. Harmless on an
          # ephemeral runner, wrong in the local mirror this must stay parity
          # with — and a cleanup that only runs on success is the kind of thing
          # that gets copied somewhere it matters.
          trap 'rm -f "$barrel"' EXIT
          bunx tsc --noEmit
      - name: Tests (adapter translation, memory integrity, rerank)
        run: bun test

  voice-gateway:
    name: Voice gateway (typecheck, VAD smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run fetch-models
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: VAD smoke (Silero preferred; energy fallback tolerated on CI runners)
        run: |
          bun run bench/vad-smoke.ts | tee vad.out
          grep -E "engine: silero" vad.out || echo "::warning::VAD ran on the energy fallback — Silero did not load on this CI runner (tolerated here; Silero is verified natively on macOS)"

  # The `edge-functions` job (deno check over supabase/functions/*/index.ts,
  # skipping _shared) used to live here. It was vacuous — supabase/functions/
  # contains only _shared/, so the loop it ran matched zero directories and
  # passed unconditionally, on every run, checking nothing. Retired in favor
  # of the "Typecheck supabase/functions/_shared" step inside the atlas-brain
  # job above, which actually typechecks that code from the perspective of
  # the one thing that still imports it. See
  # docs/decisions/013-edge-functions-ci-gate.md.
