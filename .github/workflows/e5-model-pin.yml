# Prints the pinned revision, sizes and SHA-256 of the multilingual-e5-base
# files the brain downloads on first launch (services/atlas-brain/src/modelStore.ts),
# so the pins can be (re)derived from a machine that can reach Hugging Face.
# Results are raised as a notice annotation; nothing is committed.
#
# The second job runs the brain's real first-launch path end to end: download
# through modelStore.ts (verifying the committed pins), load, embed, and check
# the vectors make sense.
name: E5 model pin

on:
  workflow_dispatch:
  push:
    branches: ["ws-*"]
    paths:
      - ".github/workflows/e5-model-pin.yml"
      - "services/atlas-brain/src/modelStore.ts"
      - "services/atlas-brain/src/localEmbed.ts"

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve revision and hash the files
        run: |
          set -euo pipefail
          rev=$(curl -sSf https://huggingface.co/api/models/Xenova/multilingual-e5-base | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')
          out="revision $rev"
          for f in tokenizer.json tokenizer_config.json onnx/model_quantized.onnx; do
            curl -sSfL -o file "https://huggingface.co/Xenova/multilingual-e5-base/resolve/$rev/$f"
            out="$out%0A$f $(stat -c %s file) $(sha256sum file | cut -d' ' -f1)"
          done
          echo "::notice title=e5 pins::$out"

  first-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/atlas-brain
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download, verify, load and embed
        env:
          ATLAS_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          cat > /tmp/e5-check.ts <<'TS'
          import { embedText } from "${{ github.workspace }}/services/atlas-brain/src/localEmbed.ts";
          const cos = (a: number[], b: number[]) => a.reduce((s, x, i) => s + x * b[i], 0);
          const q = await embedText("Hvornår skal jeg betale elregningen?", "query");
          const hit = await embedText("Elregningen fra Ørsted forfalder den 1. november.");
          const miss = await embedText("My favourite football team is FC Barcelona.");
          const out = `dims ${q.length}, hit ${cos(q, hit).toFixed(3)}, miss ${cos(q, miss).toFixed(3)}`;
          console.log(`::notice title=e5 first launch::${out}`);
          if (q.length !== 768 || !(cos(q, hit) > cos(q, miss))) { console.error(out); process.exit(1); }
          TS
          bun run /tmp/e5-check.ts
