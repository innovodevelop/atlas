<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas - AI Research Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />

    <!-- Fonts are self-hosted (public/fonts) — no request to Google on launch
         (GDPR / LG München I, 3 O 17493/20). The stylesheet lives here (not as
         a CSS @import) so it loads in parallel with the app bundle. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="description" content="Atlas is your personal AI assistant for email, documents, travel, and data research" />
    <meta name="author" content="Atlas AI" />

    <meta property="og:title" content="Atlas - AI Research Assistant" />
    <meta property="og:description" content="Your personal AI assistant for email, documents, travel, and data research" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AtlasAI" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Last-resort crash reporter. A failure before React mounts (bad chunk,
         module-eval throw, missing WKWebView API) otherwise leaves a silent
         white window: no console is reachable in a packaged release build, so
         the only symptom is "the app doesn't respond". Painting the error into
         #root makes it diagnosable from a screenshot alone. Purely additive —
         it never runs when the app boots normally. -->
    <script>
      (function () {
        function show(kind, detail) {
          var root = document.getElementById('root');
          if (!root || root.dataset.crash) return;
          root.dataset.crash = '1';
          root.innerHTML =
            '<div style="font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;' +
            'padding:28px;color:#1e1e24;background:#fffdfa;height:100vh;' +
            'overflow:auto;-webkit-user-select:text;user-select:text">' +
            '<div style="font:600 15px/1.4 system-ui;margin-bottom:10px">' +
            'Atlas failed to start (' + kind + ')</div><pre style="white-space:pre-wrap;margin:0">' +
            String(detail).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) +
            '</pre></div>';
        }
        window.addEventListener('error', function (e) {
          show('script error', (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || 0) +
            '\n' + ((e.error && e.error.stack) || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('unhandled rejection', (r && (r.stack || r.message)) || String(r));
        });
        // If nothing has rendered a few seconds in, say so rather than sit white.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.dataset.crash && root.children.length === 0) {
            show('nothing rendered', 'React did not mount within 8s and no error was raised.\n' +
              'The bundle loaded but produced no output.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
