[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Local portfolio engine (SnapTrade brokerage sync + on-device analytics):
duckdb = { version = "1.1", features = ["bundled"] }   # columnar OLAP over the full transaction history
ureq = { version = "2.10", features = ["json"] }        # lean blocking HTTP (no async runtime needed)
hmac = "0.12"                                           # SnapTrade request signing
sha2 = "0.10"
base64 = "0.22"
keyring = "2"                                           # macOS Keychain for app creds + user secret
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
