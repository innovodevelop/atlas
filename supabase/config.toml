# Cron jobs: [[cron_jobs]] was Lovable Cloud syntax and is not valid for the
# standalone Supabase CLI. The two schedules (record-usage-snapshot at 00:00,
# atlas-daily-digest at 06:00) are created via pg_cron — see CONVERSION.md.

[functions.mail-oauth-start]
verify_jwt = true

# verify_jwt=false: Google redirects the user's browser here without a JWT.
# Authenticated by the single-use server-held PKCE state row (10 min TTL).
[functions.mail-oauth-callback]
verify_jwt = false

# verify_jwt=false: pg_cron target (syncs all accounts with x-cron-secret).
# User-initiated syncs pass a JWT and are scoped to their own accounts in code.
[functions.mail-sync]
verify_jwt = false

[functions.mail-disconnect]
verify_jwt = true
