      seek: (e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ pos: Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * T.sec) }); },
      at: fmt(s.pos),
      icoShuffle: ic('shuffle'), icoSkip: ic('skip'), icoRepeat: ic('repeat'), icoStar: ic('star'), icoSpeaker: ic('speaker'),
      playIco: ic(s.playing ? 'pause' : 'play'), playL: s.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState((x) => ({ playing: !x.playing })), next: () => this.go(1), prev: () => this.go(-1),
      shOn: s.shuffle ? 'true' : 'false', shBg: s.shuffle ? '#3461f2' : 'transparent', toggleShuffle: () => this.setState((x) => ({ shuffle: !x.shuffle })),
      rpOn: s.repeat ? 'true' : 'false', rpBg: s.repeat ? '#3461f2' : 'transparent', toggleRepeat: () => this.setState((x) => ({ repeat: !x.repeat })),
      likeBg: liked ? '#f9f7f4' : 'rgba(249,247,244,.08)', likeFg: liked ? '#d0453a' : '#f9f7f4', likeFill: liked ? 'currentColor' : 'none', toggleLike: () => this.setState((x) => ({ liked: Object.assign({}, x.liked, { [T.id]: !x.liked[T.id] }) })),
      duckOn: s.duck ? 'true' : 'false', duckBg: s.duck ? '#3461f2' : 'rgba(249,247,244,.22)', duckPos: s.duck ? 'flex-end' : 'flex-start', duckDot: s.duck ? '#50dca0' : '#b6b1aa',
      duckLine: s.duck ? 'Atlas lowers the music when someone talks, and when it speaks to you.' : 'Music stays at full volume, even when Atlas speaks.', toggleDuck: () => this.setState((x) => ({ duck: !x.duck })),
      tabs: [['queue', 'Up next'], ['lyrics', 'Lyrics'], ['rooms', 'Rooms']].map(([k, l]) => ({ k, l, bg: s.tab === k ? '#f9f7f4' : 'transparent', fg: s.tab === k ? '#1e1e24' : '#f9f7f4' })),
      pickTab: (e) => this.setState({ tab: e.currentTarget.getAttribute('data-k') }),
      isQueue: s.tab === 'queue', isLyrics: s.tab === 'lyrics', isRooms: s.tab === 'rooms',
      queue: TRACKS.map((q, j) => ({ i: String(j), title: q.title, artist: q.artist, c1: q.c1, c2: q.c2, right: j === s.i ? (s.playing ? 'Playing' : 'Paused') : fmt(q.sec), tFg: j === s.i ? '#8fa9ff' : 'rgba(249,247,244,.62)', bg: j === s.i ? 'rgba(249,247,244,.1)' : 'transparent' })),
      playIdx: (e) => this.setState({ i: +e.currentTarget.getAttribute('data-k'), pos: 0, playing: true }),
      lyrics: (lyr || []).map((t, j) => ({ t, fg: j === li ? '#f9f7f4' : j < li ? 'rgba(249,247,244,.38)' : 'rgba(249,247,244,.62)', size: j === li ? '26px' : '20px' })),
      noLyrics: !lyr || !lyr.length, noLyricsLine: lyr ? 'Instrumental. Nothing to sing along to.' : 'Lyrics aren’t available for this track.',
      rooms: Object.keys(RN).map((k) => { const [on, vol] = s.rooms[k]; return { k, n: RN[k][0], d: RN[k][1] + (on ? ' · playing' : ' · off'), vol: String(vol), on: on ? 'true' : 'false', isOn: on, bg: on ? 'rgba(249,247,244,.08)' : 'transparent', icoBg: on ? '#f9f7f4' : 'rgba(249,247,244,.08)', icoFg: on ? '#1e1e24' : '#f9f7f4' }; }),
      toggleRoom: (e) => { const k = e.currentTarget.getAttribute('data-k'); this.setState((x) => ({ rooms: Object.assign({}, x.rooms, { [k]: [!x.rooms[k][0], x.rooms[k][1]] }) })); },
      setVol: (e) => { const k = e.currentTarget.getAttribute('data-k'), v = +e.currentTarget.value; this.setState((x) => ({ rooms: Object.assign({}, x.rooms, { [k]: [x.rooms[k][0], v] }) })); },
      moods: [['focus', 'Focus', 'No vocals, steady tempo', '#3461f2'], ['wind', 'Wind down', 'Softer every 10 minutes', '#7854ff'], ['cook', 'Cooking', 'Kitchen speaker, upbeat', '#e07a1f'], ['run', 'Run', 'Matches your 5:12 pace', '#0fae76']].map(([k, t, d, sw]) => { const on = s.mood === k; return { k, t, d, sw, bg: on ? '#f9f7f4' : '#26262d', fg: on ? '#1e1e24' : '#f9f7f4', sub: on ? '#6d6a67' : 'rgba(249,247,244,.62)' }; }),
      pickMood: (e) => { const k = e.currentTarget.getAttribute('data-k'); this.setState((x) => ({ mood: x.mood === k ? null : k, i: k === 'focus' ? 4 : k === 'wind' ? 2 : k === 'run' ? 3 : x.i, pos: 0, playing: true })); },
      dock: [['home', 'Home', 'Atlas Dashboard Beta.dc.html'], ['core', 'Core', 'Atlas Core Beta.dc.html'], ['teach', 'Teach', 'Atlas Teach Beta.dc.html'], ['mail', 'Mail', 'Atlas Mail Beta.dc.html'], ['architecture', 'Architecture', 'Atlas Architecture Beta.dc.html'], ['voice', 'Voice', 'Atlas Voice Beta.dc.html']].map(([k, l, h]) => ({ l, h, ico: ic(k) }))
    };
  }
}
